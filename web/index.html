<!DOCTYPE html>
<html lang="el">
<head>
  <!-- Replaced by `flutter build web --base-href /pastra/` (GitHub Pages). -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="description" content="Πάστρα – the Greek card game. Pastra vs the computer, 1v1 or 2v2.">

  <!-- iPhone: "Add to Home Screen" opens full screen, status bar over the felt. -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Πάστρα">
  <meta name="theme-color" content="#052E1E">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.json">

  <title>Πάστρα · Pastra</title>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      overscroll-behavior: none;
      background: #052E1E;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
      touch-action: none; /* cards are dragged: no browser scrolling or zooming */
    }
    body {
      position: fixed;
      inset: 0;
      background: radial-gradient(ellipse at 50% 40%, #0A5A39 0%, #052E1E 80%);
      font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    /* Flutter draws into this box: inside the iPhone safe area (notch, home
       bar). The game is landscape; on a very wide window it stays 2.2:1. */
    #app {
      position: fixed;
      top: env(safe-area-inset-top, 0px);
      bottom: env(safe-area-inset-bottom, 0px);
      left: env(safe-area-inset-left, 0px);
      right: env(safe-area-inset-right, 0px);
      margin: 0 auto;
      max-width: 220vh;
    }
    #loading {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      color: #fff;
      pointer-events: none;
      transition: opacity 0.35s ease;
    }
    #loading .title { font-size: 44px; font-weight: 800; letter-spacing: 1px; }
    #loading .spinner {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: 4px solid rgba(255, 255, 255, 0.2);
      border-top-color: #F2C14E;
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="app"></div>
  <div id="loading">
    <div class="title">Πάστρα</div>
    <div class="spinner"></div>
  </div>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
