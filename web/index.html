<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Replaced by `flutter build web --base-href /pastra/` (GitHub Pages). -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="description" content="Pastra – the Greek card game. Play against the computer or online, 1v1 or 2v2.">

  <!-- iPhone: "Add to Home Screen" opens full screen, status bar over the felt. -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Pastra">
  <meta name="theme-color" content="#052E1E">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.json">

  <title>Pastra</title>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      overscroll-behavior: none;
      background: #052E1E;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
      touch-action: none; /* cards are dragged: no browser scrolling or zooming */
    }
    body {
      position: fixed;
      inset: 0;
      background: radial-gradient(ellipse at 50% 40%, #0A5A39 0%, #052E1E 80%);
      font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    /* Flutter draws into this box: inside the iPhone safe area (notch, home
       bar). The game is landscape; on a very wide window it stays 2.2:1. */
    #app {
      position: fixed;
      top: env(safe-area-inset-top, 0px);
      bottom: env(safe-area-inset-bottom, 0px);
      left: env(safe-area-inset-left, 0px);
      right: env(safe-area-inset-right, 0px);
      margin: 0 auto;
      max-width: 220vh;
    }
    #loading {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      color: #fff;
      pointer-events: none;
      transition: opacity 0.35s ease;
    }
    #loading .title { font-size: 44px; font-weight: 800; letter-spacing: 1px; }
    #loading .spinner {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: 4px solid rgba(255, 255, 255, 0.2);
      border-top-color: #F2C14E;
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="app"></div>
  <div id="loading">
    <div class="title" id="splash-title">Pastra</div>
    <div class="spinner"></div>
  </div>
  <script>
    // Splash title in the language the player chose (English the first time).
    (function () {
      var titles = {
        el: 'Πάστρα', ru: 'Пастра', bg: 'Пастра', ar: 'باسترا', zh: 'Pastra 帕斯特拉'
      };
      try {
        var raw = window.localStorage.getItem('flutter.language');
        var lang = 'en';
        if (raw) { try { lang = JSON.parse(raw); } catch (e) { lang = raw; } }
        var title = titles[lang] || 'Pastra';
        document.getElementById('splash-title').textContent = title;
        document.documentElement.lang = lang;
      } catch (e) {}
    })();
  </script>
  <script>
    // Sound effects on the web with the Web Audio API: every sound is decoded
    // once into memory and played from there, with no delay. iPhone/iPad
    // Safari only allows sound after a touch and stops it after the screen
    // was locked, a call or a switch to another app, so the audio is
    // (re)started on every touch and when the page becomes visible again.
    window.pastraSfx = (function () {
      var ctx = null, buffers = {}, loading = {};
      function context() {
        if (ctx && ctx.state === 'closed') { ctx = null; buffers = {}; loading = {}; }
        if (!ctx) {
          var C = window.AudioContext || window.webkitAudioContext;
          if (!C) return null;
          ctx = new C();
        }
        return ctx;
      }
      // iPhone: Web Audio is muted by the ring/silent switch unless the page
      // says it plays "media". Newer Safari has audioSession for that; older
      // ones switch to media when a (silent) <audio> element plays.
      var mediaMode = false;
      function playbackMode() {
        if (mediaMode) return;
        mediaMode = true;
        try {
          if (navigator.audioSession) { navigator.audioSession.type = 'playback'; return; }
        } catch (e) {}
        try {
          var el = document.createElement('audio');
          el.setAttribute('x-webkit-airplay', 'deny');
          el.preload = 'auto';
          el.loop = true;
          el.src = 'data:audio/wav;base64,UklGRkQDAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YSADAACAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgA==';
          el.play().catch(function () { mediaMode = false; });
        } catch (e) { mediaMode = false; }
      }
      function wake() {
        playbackMode();
        var c = context();
        if (!c) return;
        if (c.state !== 'running') { try { c.resume(); } catch (e) {} }
        try { // iOS: a silent sound inside the touch unlocks the audio
          var s = c.createBufferSource();
          s.buffer = c.createBuffer(1, 1, 22050);
          s.connect(c.destination);
          s.start(0);
        } catch (e) {}
      }
      ['touchend', 'pointerdown', 'mousedown', 'keydown'].forEach(function (name) {
        window.addEventListener(name, wake, { capture: true, passive: true });
      });
      document.addEventListener('visibilitychange', function () {
        if (!document.hidden && ctx && ctx.state !== 'running') { try { ctx.resume(); } catch (e) {} }
      });
      function load(file) {
        var c = context();
        if (!c || buffers[file] || loading[file]) return;
        loading[file] = fetch('assets/assets/' + file)
          .then(function (r) { return r.arrayBuffer(); })
          .then(function (data) {
            return new Promise(function (ok, fail) { c.decodeAudioData(data, ok, fail); });
          })
          .then(function (buffer) { buffers[file] = buffer; })
          .catch(function () { delete loading[file]; });
      }
      return {
        load: function (files) { files.split(',').forEach(load); },
        play: function (file, volume) {
          var c = context();
          if (!c) return;
          if (c.state !== 'running') { try { c.resume(); } catch (e) {} }
          var buffer = buffers[file];
          if (!buffer) { load(file); return; }
          try {
            var src = c.createBufferSource();
            var gain = c.createGain();
            gain.gain.value = volume;
            src.buffer = buffer;
            src.connect(gain);
            gain.connect(c.destination);
            src.start(0);
          } catch (e) {}
        }
      };
    })();
  </script>
  <script>
    // Full screen (the button in the corner, like on YouTube). iPhone Safari
    // has no full screen for pages: there "Add to Home Screen" is the way.
    window.pastraFullscreen = {
      supported: function () {
        var d = document.documentElement;
        return !!(document.fullscreenEnabled || document.webkitFullscreenEnabled) &&
          !!(d.requestFullscreen || d.webkitRequestFullscreen);
      },
      isOn: function () {
        return !!(document.fullscreenElement || document.webkitFullscreenElement);
      },
      isIos: function () {
        return /iPhone|iPad|iPod/.test(navigator.userAgent) ||
          (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
      },
      standalone: function () {
        return window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
      },
      toggle: function () {
        try {
          if (window.pastraFullscreen.isOn()) {
            (document.exitFullscreen || document.webkitExitFullscreen).call(document);
          } else {
            var d = document.documentElement;
            var p = (d.requestFullscreen || d.webkitRequestFullscreen).call(d, { navigationUI: 'hide' });
            // Phones: keep it sideways while in full screen (where allowed).
            if (p && p.then && screen.orientation && screen.orientation.lock) {
              p.then(function () { screen.orientation.lock('landscape').catch(function () {}); }).catch(function () {});
            }
          }
        } catch (e) {}
      }
    };
  </script>
  <script>
    // Keep the screen on while the game is open (the phone would otherwise
    // dim and lock during the other players' turns). Needs a tap first, and
    // is asked again when the page comes back to the front.
    (function () {
      var lock = null;
      function keepAwake() {
        if (!('wakeLock' in navigator) || lock || document.visibilityState !== 'visible') return;
        navigator.wakeLock.request('screen').then(function (l) {
          lock = l;
          l.addEventListener('release', function () { lock = null; });
        }).catch(function () {});
      }
      ['pointerdown', 'touchend', 'keydown'].forEach(function (name) {
        document.addEventListener(name, keepAwake, { passive: true });
      });
      document.addEventListener('visibilitychange', keepAwake);
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
